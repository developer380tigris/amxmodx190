name: Prepare Dependency Archives

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 1.9-dev
  pull_request:
    branches:
      - master
      - 1.9-dev

jobs:
  package:
    name: ${{ matrix.os_short }}-${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            os_short: linux
            package_name: dependencies-linux

          - os: windows-2022
            os_short: windows
            package_name: dependencies-windows

    env:
      DEPENDENCIES_FOLDER: dependencies
      DEPENDENCIES_ROOT: ${{ github.workspace }}/dependencies
      DEPENDENCIES_ROOT_WIN: ${{ github.workspace }}\dependencies
      PACKAGE_ROOT: package_root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: amxmodx
          fetch-depth: 1

      - name: Setup Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Prepare Linux dependencies
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${DEPENDENCIES_FOLDER}"
          cd "${DEPENDENCIES_FOLDER}"

          # checkout-deps.sh требует наличие каталога amxmodx
          mkdir -p amxmodx
          ../amxmodx/support/checkout-deps.sh

      - name: Prepare Windows dependencies
        if: startsWith(runner.os, 'Windows')
        shell: cmd
        run: |
          if not exist "%DEPENDENCIES_ROOT_WIN%" mkdir "%DEPENDENCIES_ROOT_WIN%"

          if not exist "%DEPENDENCIES_ROOT_WIN%\nasm" mkdir "%DEPENDENCIES_ROOT_WIN%\nasm"
          curl -L -o "%DEPENDENCIES_ROOT_WIN%\nasm\nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/2.13.03/win32/nasm-2.13.03-win32.zip

          cd /d "%DEPENDENCIES_ROOT_WIN%\nasm"
          7z x nasm.zip

          cd /d "%DEPENDENCIES_ROOT_WIN%"
          git clone https://github.com/alliedmodders/ambuild
          git clone https://github.com/alliedmodders/metamod-hl1 metamod-am
          git clone https://github.com/alliedmodders/hlsdk

          curl -L -o "mysql-connector-c-6.1.1-win32.zip" https://downloads.mysql.com/archives/get/p/19/file/mysql-connector-c-6.1.1-win32.zip
          7z x mysql-connector-c-6.1.1-win32.zip -o"mysql"

          cd /d "%DEPENDENCIES_ROOT_WIN%\mysql"
          ren mysql-connector-c-6.1.1-win32 mysql-5.5
          move /Y mysql-5.5 ..\

      - name: Build Linux package structure
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${PACKAGE_ROOT}"
          mkdir -p "${PACKAGE_ROOT}/dependencies"

          cp -R "${DEPENDENCIES_ROOT}/metamod-am" "${PACKAGE_ROOT}/dependencies/"
          cp -R "${DEPENDENCIES_ROOT}/hlsdk" "${PACKAGE_ROOT}/dependencies/"
          cp -R "${DEPENDENCIES_ROOT}/mysql-5.5" "${PACKAGE_ROOT}/dependencies/"

          cat > "${PACKAGE_ROOT}/README.txt" << 'EOF'
          This archive contains prepared dependency folders for Linux.
          No AMXModX build has been performed.
          Included:
          - dependencies/metamod-am
          - dependencies/hlsdk
          - dependencies/mysql-5.5
          EOF

      - name: Archive Linux package
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          set -euxo pipefail

          tar -czf "${{ matrix.package_name }}.tar.gz" -C "${PACKAGE_ROOT}" .

      - name: Upload Linux package artifact
        if: startsWith(runner.os, 'Linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}-${{ github.sha }}
          path: ${{ matrix.package_name }}.tar.gz
          retention-days: 7

      - name: Build Windows package structure
        if: startsWith(runner.os, 'Windows')
        shell: cmd
        run: |
          if exist "%PACKAGE_ROOT%" rmdir /s /q "%PACKAGE_ROOT%"
          mkdir "%PACKAGE_ROOT%"
          mkdir "%PACKAGE_ROOT%\dependencies"

          xcopy "%DEPENDENCIES_ROOT_WIN%\ambuild" "%PACKAGE_ROOT%\dependencies\ambuild" /E /I /Y
          xcopy "%DEPENDENCIES_ROOT_WIN%\metamod-am" "%PACKAGE_ROOT%\dependencies\metamod-am" /E /I /Y
          xcopy "%DEPENDENCIES_ROOT_WIN%\hlsdk" "%PACKAGE_ROOT%\dependencies\hlsdk" /E /I /Y
          xcopy "%DEPENDENCIES_ROOT_WIN%\mysql-5.5" "%PACKAGE_ROOT%\dependencies\mysql-5.5" /E /I /Y
          xcopy "%DEPENDENCIES_ROOT_WIN%\nasm" "%PACKAGE_ROOT%\dependencies\nasm" /E /I /Y

          (
            echo This archive contains prepared dependency folders for Windows.
            echo No AMXModX build has been performed.
            echo Included:
            echo - dependencies\ambuild
            echo - dependencies\metamod-am
            echo - dependencies\hlsdk
            echo - dependencies\mysql-5.5
            echo - dependencies\nasm
          ) > "%PACKAGE_ROOT%\README.txt"

      - name: Archive Windows package
        if: startsWith(runner.os, 'Windows')
        shell: powershell
        run: |
          Compress-Archive -Path "${env:PACKAGE_ROOT}\*" -DestinationPath "${{ matrix.package_name }}.zip" -Force

      - name: Upload Windows package artifact
        if: startsWith(runner.os, 'Windows')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}-${{ github.sha }}
          path: ${{ matrix.package_name }}.zip
          retention-days: 7
